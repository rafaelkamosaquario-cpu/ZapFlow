<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8FB" />
  <script>
    (function(){try{var t=localStorage.getItem('zapflow_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <title>ZapFlow — Visitas</title>
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo.svg" alt="ZapFlow" class="logo-img" />
      <div>
        <h1>Zap<span class="brand-accent">Flow</span></h1>
        <p>Visitas em Campo</p>
      </div>
    </div>
    <nav class="topnav">
      <button class="navbtn" id="btnLogout" type="button"><i data-icon="logout" data-size="16"></i> Sair</button>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <div id="resumoStrip" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;"></div>

      <div class="tabs" id="visitaTabs">
        <button class="tab active" type="button" data-tab="hoje">Hoje</button>
        <button class="tab" type="button" data-tab="followup">Follow-up</button>
        <button class="tab" type="button" data-tab="historico">Histórico</button>
      </div>
      <button class="btn primary" id="btnIniciarVisita" type="button" style="width:100%; margin-top:10px;">
        <i data-icon="plus" data-size="18"></i> Iniciar visita
      </button>
      <p class="hint" id="visitasHint"></p>
      <div id="visitasList" class="dash-list"></div>
    </section>
  </main>

  <!-- Iniciar visita -->
  <div class="modal hidden" id="iniciarModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3>Iniciar visita</h3>
        <button class="modal-close" id="btnFecharIniciar" type="button"><i data-icon="x" data-size="18"></i></button>
      </div>
      <p class="hint" id="geoStatus">📍 Obtendo localização...</p>
      <label>Cliente
        <input type="text" id="vfCliente" placeholder="Nome do cliente/empresa" />
      </label>
      <label>Objetivo da visita
        <input type="text" id="vfObjetivo" placeholder="Ex.: Apresentar proposta" />
      </label>
      <button class="btn primary" id="btnConfirmarIniciar" type="button" style="width:100%; margin-top:6px;">Iniciar</button>
      <p class="status" id="iniciarStatus"></p>
    </div>
  </div>

  <!-- Visita em andamento -->
  <div class="modal hidden" id="duranteModal">
    <div class="modal-box modal-wide">
      <div class="modal-head">
        <h3 id="duranteCliente">Visita em andamento</h3>
      </div>
      <p class="hint" id="duranteObjetivo"></p>
      <p class="hint">⏱️ Duração: <b id="duranteTimer">00:00</b></p>

      <div class="manual-add" style="margin-top:6px;">
        <p class="manual-title">Contato e observação</p>
        <div class="manual-row">
          <input type="text" id="durContato" placeholder="Nome do contato" />
          <input type="tel" id="durTelefone" placeholder="Telefone do contato" />
        </div>
        <textarea id="durObservacao" rows="2" placeholder="📝 Observações da visita" style="margin-top:8px;"></textarea>
        <button class="btn secondary sm" id="btnSalvarDetalhes" type="button" style="margin-top:6px;">Salvar</button>
        <span class="status" id="detalhesStatus"></span>
      </div>

      <div class="manual-add">
        <p class="manual-title">📷 Foto</p>
        <input type="file" id="durFoto" accept="image/*" capture="environment" />
        <span class="status" id="fotoStatus"></span>
        <div id="fotosPreview" class="hint"></div>
      </div>

      <div class="manual-add">
        <p class="manual-title">💰 Oportunidade</p>
        <div class="manual-row">
          <input type="number" id="durValor" placeholder="Valor potencial (R$)" step="0.01" min="0" />
          <button class="btn secondary sm" id="btnSalvarValor" type="button">Salvar</button>
        </div>
        <span class="status" id="valorStatus"></span>
      </div>

      <div class="manual-add">
        <p class="manual-title">📅 Agendar retorno</p>
        <div class="manual-row">
          <input type="date" id="durData" />
          <input type="time" id="durHora" value="09:00" />
          <button class="btn secondary sm" id="btnAgendar" type="button">Agendar</button>
        </div>
        <span class="status" id="agendarStatus"></span>
      </div>

      <div class="manual-add">
        <p class="manual-title">Finalizar visita</p>
        <label>Motivo
          <select id="finMotivo">
            <option>Venda</option>
            <option>Prospecção</option>
            <option>Cobrança</option>
            <option>Pós-venda</option>
            <option>Outro</option>
          </select>
        </label>
        <label>Resultado
          <select id="finResultado">
            <option>Interessado</option>
            <option>Negociação</option>
            <option>Sem interesse</option>
            <option>Pedido fechado</option>
            <option>Retornar</option>
          </select>
        </label>
        <button class="btn primary" id="btnFinalizar" type="button" style="width:100%;">Finalizar visita</button>
        <span class="status" id="finalizarStatus"></span>
      </div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="icons.js"></script>
  <script src="visitas.js"></script>
</body>
</html>
