<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8FB" />
  <script>
    (function(){try{var t=localStorage.getItem('zapflow_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <title>ZapFlow — Visitas</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <div class="login-box">
    <img src="/zappy.svg" alt="Zappy" class="login-mascot" />
    <h1 class="login-title">Zap<span>Flow</span></h1>
    <p class="login-sub">Área de Visitas — em breve</p>
    <p class="login-sub">Seu acesso é só para registrar visitas em campo. Essa área ainda está sendo construída.</p>
    <button class="btn primary" type="button" id="logoutBtn">Sair</button>
  </div>
  <script src="/theme.js"></script>
  <script>
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try { await fetch("/api/logout", { method: "POST" }); } catch {}
      window.location.href = "/login";
    });
  </script>
</body>
</html>
