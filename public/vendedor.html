<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8FB" />
  <script>
    (function(){try{var t=localStorage.getItem('zapflow_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <title>ZapFlow — Visitas</title>
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo.svg" alt="ZapFlow" class="logo-img" />
      <div>
        <h1>Zap<span class="brand-accent">Flow</span></h1>
        <p>Visitas em Campo</p>
      </div>
    </div>
    <nav class="topnav">
      <button class="navbtn" id="btnLogout" type="button"><i data-icon="logout" data-size="16"></i> Sair</button>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <div class="tabs" id="visitaTabs">
        <button class="tab active" type="button" data-tab="hoje">Hoje</button>
        <button class="tab" type="button" data-tab="followup">Follow-up</button>
        <button class="tab" type="button" data-tab="historico">Histórico</button>
      </div>
      <button class="btn primary" id="btnNovaVisita" type="button" style="width:100%; margin-top:10px;">
        <i data-icon="plus" data-size="18"></i> Registrar visita
      </button>
      <p class="hint" id="visitasHint"></p>
      <div id="visitasList" class="dash-list"></div>
    </section>
  </main>

  <!-- Formulário: registrar visita -->
  <div class="modal hidden" id="visitaModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3>Registrar visita</h3>
        <button class="modal-close" id="btnFecharVisita" type="button"><i data-icon="x" data-size="18"></i></button>
      </div>

      <p class="hint" id="geoStatus">📍 Obtendo localização...</p>

      <label>Cliente
        <input type="text" id="vfCliente" placeholder="Nome do cliente/empresa" />
      </label>
      <label>Contato
        <input type="text" id="vfContato" placeholder="Nome de quem você falou" />
      </label>
      <label>Telefone do contato
        <input type="tel" id="vfTelefone" placeholder="(opcional)" />
      </label>
      <label>Motivo da visita
        <select id="vfMotivo">
          <option>Venda</option>
          <option>Prospecção</option>
          <option>Cobrança</option>
          <option>Pós-venda</option>
          <option>Outro</option>
        </select>
      </label>
      <label>Resultado
        <select id="vfResultado">
          <option>Interessado</option>
          <option>Negociação</option>
          <option>Sem interesse</option>
          <option>Pedido fechado</option>
          <option>Retornar</option>
        </select>
      </label>
      <label>Observação
        <textarea id="vfObservacao" rows="3" placeholder="Digite aqui"></textarea>
      </label>
      <label>Próxima ação
        <input type="text" id="vfProximaAcao" placeholder="Ex.: enviar tabela amanhã" />
      </label>
      <label>Próxima visita (opcional)
        <input type="date" id="vfProximaData" />
      </label>
      <label>Valor potencial em R$ (opcional)
        <input type="number" id="vfValor" step="0.01" min="0" />
      </label>

      <div style="display:flex; gap:10px; margin-top:6px;">
        <button class="btn secondary" id="btnCancelarVisita" type="button" style="flex:1;">Cancelar</button>
        <button class="btn primary" id="btnSalvarVisita" type="button" style="flex:1;">Salvar visita</button>
      </div>
      <p class="status" id="visitaStatus"></p>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="icons.js"></script>
  <script src="visitas.js"></script>
</body>
</html>
