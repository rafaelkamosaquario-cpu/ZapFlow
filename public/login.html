<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8FB" />
  <script>
    (function(){try{var t=localStorage.getItem('zapflow_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <title>ZapFlow</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <div class="login-box">
    <img src="/zappy.svg" alt="Zappy" class="login-mascot" />
    <h1 class="login-title">Zap<span>Flow</span></h1>
    <p class="login-sub">Entre para acessar suas campanhas</p>

    <form id="loginForm" class="login-form">
      <label>Usuário
        <input type="text" id="user" autocomplete="username" required />
      </label>
      <label>Senha
        <input type="password" id="password" autocomplete="current-password" required />
      </label>
      <button class="btn primary" type="submit" id="loginBtn">Entrar</button>
      <p id="loginError" class="login-error"></p>
    </form>
  </div>
  <script src="/theme.js"></script>
  <script src="/login.js"></script>
</body>
</html>
